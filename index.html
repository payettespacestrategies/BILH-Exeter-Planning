:root{
  --bg:#ffffff; --ink:#233044; --mut:#54637d; --faint:#8494ab; --line:#e2e6ec;
  --card:#ffffff; --accent:#1266cc; --tint:#ecf4f6;
  --hlt:#3CA09E; --hltbg:#e9f4f3; --table-hltbg:#fde6f6;
  --amber:#FEB522; --navy:#1d4f91; --warn:#c0392b; --warnbg:#fdf0ee;
  --line2:#ccd2dc;
}
*{ box-sizing:border-box; }
html,body{ margin:0; background:var(--bg); }
body{ font-family:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; font-weight:400; color:var(--ink); line-height:1.5; padding:20px; }
.wrap{ max-width:1240px; margin:0 auto; }
h1{ font-weight:900; letter-spacing:-.01em; font-size:34px; margin:0; }
h2{ font-weight:900; font-size:20px; margin:0 0 12px; }
h3{ font-weight:900; font-size:16px; margin:0 0 4px; }
header{ border-bottom:2px solid var(--ink); padding-bottom:16px; margin-bottom:16px; }
.head-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; }
.eyebrow{ font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.16em; color:var(--faint); }
.sub{ font-weight:300; font-size:16px; color:var(--mut); margin:6px 0 0; }
.logos{ display:flex; align-items:center; gap:22px; }
section{ margin-bottom:26px; }

/* tabs */
.tabs{ display:flex; gap:4px; border-bottom:2px solid var(--ink); margin-bottom:22px; flex-wrap:wrap; }
.tab{ padding:10px 22px; cursor:pointer; font-weight:900; font-size:15px; background:var(--tint); color:var(--mut); border:1px solid var(--line); border-bottom:none; user-select:none; }
.tab.on{ background:var(--ink); color:#fff; border-color:var(--ink); }

/* toolbar */
.tools{ display:flex; gap:8px; align-items:center; margin:14px 0 4px; flex-wrap:wrap; }
.seg{ border:1px solid var(--ink); background:var(--card); padding:7px 14px; cursor:pointer; font-weight:900; font-size:13px; user-select:none; font-family:inherit; color:var(--ink); }
.seg:hover{ background:var(--ink); color:#fff; }
.seg.sm{ font-size:11px; padding:4px 10px; }
.seg.on{ background:var(--ink); color:#fff; }
label.seg{ display:inline-block; }

/* fields */
.field label{ display:block; font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.07em; color:var(--mut); margin-bottom:2px; }
.ln{ display:flex; align-items:baseline; gap:4px; }
.ln span{ font-size:13px; font-weight:300; color:var(--mut); }
input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
input[type="number"]{ -moz-appearance:textfield; }
.input-line{ background:transparent; border:none; border-bottom:1px solid #c7cfdb; padding:3px 0; font-family:inherit; font-feature-settings:'tnum' 1; font-size:.95rem; font-weight:500; color:var(--ink); width:100%; outline:none; }
.input-line:focus{ border-bottom-color:var(--accent); }
.hint{ font-size:12px; font-weight:300; color:var(--faint); margin-top:8px; }
.assumed{ display:inline-block; font-size:9.5px; font-weight:900; letter-spacing:.09em; text-transform:uppercase; color:#9a6b00; background:#fff5db; border:1px solid #f0dca8; padding:1px 5px; vertical-align:1px; margin-left:6px; }

/* cards */
.card{ background:var(--card); border:1px solid var(--line); padding:12px 14px; }
.card .lab{ font-size:10px; text-transform:uppercase; letter-spacing:.09em; font-weight:900; margin-bottom:2px; color:var(--mut); }
.card .big{ font-weight:900; font-size:21px; font-feature-settings:'tnum' 1; }
.card .sm{ font-size:11px; font-weight:300; color:var(--mut); margin-top:1px; }
.card.hi{ border-left:4px solid var(--hlt); background:var(--hltbg); }
.card.bad{ border-left:4px solid var(--warn); background:var(--warnbg); }
.card.warn{ border-left:4px solid var(--amber); background:#fdf7e6; }
.box{ background:var(--card); border:1px solid var(--line); padding:18px; }
.cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }

/* program category */
.prog-cat{ border:1px solid var(--line); margin-bottom:26px; }
.band{ display:flex; align-items:center; gap:12px; padding:10px 16px; }
.band .bt{ font-weight:900; font-size:16px; color:var(--ink); }
.band .chain{ margin-left:auto; font-size:13.5px; font-weight:400; color:var(--ink); font-feature-settings:'tnum' 1; white-space:nowrap; }
.band .chain b{ font-weight:900; }
.band .chain span{ font-weight:300; color:rgba(35,48,68,.6); padding:0 2px; }
.cat-note{ padding:8px 16px; font-size:12px; font-weight:300; color:var(--mut); border-bottom:1px solid var(--line); background:#fbfcfd; }
.drivers{ padding:12px 16px; border-bottom:1px solid var(--line); display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px 22px; background:#fff; }
.kpis{ padding:12px 16px; border-bottom:1px solid var(--line); display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:10px; background:#fbfcfd; }

/* tables */
table.prog{ width:100%; border-collapse:collapse; font-size:13.5px; }
table.prog thead th{ border-bottom:1px solid var(--ink); font-size:10.5px; font-weight:500; text-transform:uppercase; letter-spacing:.07em; color:var(--mut); padding:7px 8px; text-align:left; background:#fff; }
table.prog thead th.r{ text-align:right; }
table.prog thead th.c{ text-align:center; }
table.prog td{ border-bottom:1px solid var(--line); padding:4px 8px; vertical-align:middle; }
table.prog td.r{ text-align:right; font-feature-settings:'tnum' 1; }
table.prog td.c{ text-align:center; }
table.prog tr:hover td{ background:#f7fafc; }
table.prog input.cell{ width:100%; border:none; border-bottom:1px dashed transparent; background:transparent; font-family:inherit; font-feature-settings:'tnum' 1; font-size:13.5px; font-weight:400; color:var(--ink); padding:2px 0; outline:none; }
table.prog input.cell:hover{ border-bottom-color:#c7cfdb; }
table.prog input.cell:focus{ border-bottom-color:var(--accent); }
table.prog input.cell.r{ text-align:right; }
table.prog input.cell.notes{ font-size:11.5px; font-weight:300; color:var(--mut); }
table.prog td.nsf{ font-weight:500; font-feature-settings:'tnum' 1; }
table.prog td.sub{ background:#f3f6f9; font-weight:900; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--mut); }
/* editable program table — drag-to-reorder + Payette colour picker */
table.prog td.dragc{ width:16px; color:#b6bfcc; cursor:grab; user-select:none; font-size:13px; text-align:center; padding:4px 2px; }
table.prog td.dragc:hover{ color:var(--ink); }
table.prog tr.dragging{ opacity:.4; }
table.prog tr.drag-over-top td{ border-top:2px solid var(--accent); }
table.prog tr.drag-over-bottom td{ border-bottom:2px solid var(--accent); }
table.prog td.rown{ width:24px; text-align:center; font-size:11px; color:var(--faint); font-weight:500; cursor:grab; font-feature-settings:'tnum' 1; }
.color-pick{ position:relative; display:inline-block; width:22px; height:16px; border:1px solid rgba(35,48,68,.4); cursor:pointer; vertical-align:middle; }
.color-pick:hover{ outline:2px solid var(--accent); }
.color-pick select{ position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; border:none; }
.band input.bt-input{ flex:1; min-width:120px; font-weight:900; font-size:16px; color:var(--ink); background:transparent; border:none; outline:none; font-family:inherit; }
tr.totalrow td{ font-weight:900; border-top:2px solid var(--ink); border-bottom:none; font-size:15px; font-feature-settings:'tnum' 1; }
tr.subtot td{ font-weight:900; background:#f7fafc; }
.sw{ display:inline-block; width:14px; height:14px; border:1px solid rgba(35,48,68,.35); vertical-align:middle; }
.delb{ border:none; background:none; color:#c0392b; font-size:13px; cursor:pointer; padding:2px 6px; font-family:inherit; }
.delb:hover{ font-weight:900; }
table.rates{ width:100%; border-collapse:collapse; font-size:14px; }
table.rates thead th{ border-bottom:1px solid var(--ink); font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.07em; color:var(--mut); padding:8px; text-align:right; }
table.rates thead th.l{ text-align:left; }
table.rates td{ border-bottom:1px solid var(--line); padding:7px 8px; }
table.rates td.r{ text-align:right; font-feature-settings:'tnum' 1; }
table.rates td.bname{ font-weight:900; }
table.rates td.fl{ font-weight:300; color:var(--mut); }
table.rates tr.grand td{ font-weight:900; border-top:2px solid var(--ink); border-bottom:none; font-size:15px; }
table.rates tr.sel td{ background:var(--table-hltbg); }
.legend{ display:flex; gap:16px; flex-wrap:wrap; font-size:12px; font-weight:300; color:var(--mut); margin:10px 0 0; }
.legend .sw{ margin-right:5px; }
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;border:1px solid rgba(35,48,68,.3);margin-right:6px;vertical-align:-1px}
.placeholder{ border:1px dashed #c7cfdb; padding:26px; text-align:center; color:var(--faint); font-size:13px; font-weight:300; }
.sitewrap{ border:1px solid var(--line); background:#fff; }
.sitewrap svg{ display:block; width:100%; height:auto; }
.milestones{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:0; border:1px solid var(--line); }
.milestones div{ padding:8px 12px; border-right:1px solid var(--line); }
.milestones div:last-child{ border-right:none; }
.milestones .d{ font-weight:900; font-size:13px; font-feature-settings:'tnum' 1; }
.milestones .l{ font-size:11px; font-weight:300; color:var(--mut); }
footer{ margin-top:30px; padding-top:14px; border-top:1px solid var(--line); font-size:11px; font-weight:300; color:var(--faint); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }
#rc-prog-panel::-webkit-scrollbar{width:5px}
#rc-prog-panel::-webkit-scrollbar-track{background:#f1f3f6}
#rc-prog-panel::-webkit-scrollbar-thumb{background:#ccd2dc;border-radius:3px}
#rc-site-viewport{user-select:none}
@media print{
  .tab{ display:none; } .tab.on{ display:inline-block; }
  .tools{ display:none; }
  .prog-cat,.box,.card{ break-inside:avoid; }
}
</style>
</head>

}

// ── Existing bed arithmetic ─────────────────────────────────────────
// "dbl" is BEDS in semi-private rooms; each conversion to private loses one bed.
function semiRooms(u){ return Math.round((Number(u.dbl)||0)/2); }
function unitExistingBeds(u){ return (Number(u.single)||0)+(Number(u.dbl)||0); }
// The room count is what the floor plate holds, and conversion does not change it —
// a semi-private room becomes a private room in the same footprint, one bed lighter.
function unitRooms(u){ return (Number(u.single)||0)+semiRooms(u); }
function unitConverted(u){ var c=S.conversion[u.id]; return Math.min(semiRooms(u), Math.max(0, Number(c)||0)); }
// New private rooms built to win back the beds that conversion gives up. These
// are the only thing on this table that costs floor area — every one of them
// needs a room's worth of BGSF that the existing plate does not have.
function unitAdded(u){ return Math.max(0, Math.round(Number(S.added[u.id])||0)); }
function unitRoomsAfter(u){ return unitRooms(u)+unitAdded(u); }
function unitProposedBeds(u){ return unitExistingBeds(u)-unitConverted(u)+unitAdded(u); }
function unitPrivateBeds(u){ return (Number(u.single)||0)+unitConverted(u)+unitAdded(u); }
function unitAddedGSF(u){ return bgsfForRooms(u.type, unitAdded(u)); }
// rooms to add so this unit ends with the bed count it has today
function unitHoldBeds(u){ return unitConverted(u); }
function existingTotals(){
  var t={single:0,dbl:0,beds:0,semiRooms:0,rooms:0,converted:0,added:0,roomsAfter:0,
         proposed:0,private:0,gsf:0,addedGsf:0};
  S.existing.forEach(function(u){
    t.single+=Number(u.single)||0; t.dbl+=Number(u.dbl)||0;
    t.beds+=unitExistingBeds(u); t.semiRooms+=semiRooms(u);
    t.rooms+=unitRooms(u);
    t.converted+=unitConverted(u); t.added+=unitAdded(u);
    t.roomsAfter+=unitRoomsAfter(u);
    t.proposed+=unitProposedBeds(u);
    t.private+=unitPrivateBeds(u);
    t.gsf+=bgsfForRooms(u.type, unitRoomsAfter(u));
    t.addedGsf+=unitAddedGSF(u);
  });
  t.privatePct = t.proposed? t.private/t.proposed : 0;
  t.existingPrivatePct = t.beds? t.single/t.beds : 0;
  t.bedDelta = t.proposed-t.beds;
  return t;
}

// ── Space program arithmetic ────────────────────────────────────────
function moduleNSF(){ return S.module.rows.reduce(function(a,r){ return a+(Number(r.nsf)||0); },0); }
function nsfPerBed(){ var b=Number(S.module.beds.v)||1; return moduleNSF()/b; }
function dgsfPerBed(){ return nsfPerBed()*Number(S.grossing.nsf_dgsf.v); }
function bgsfPerBed(){ return dgsfPerBed()*Number(S.grossing.dgsf_bgsf.v); }
// The source module is all-private, so BGSF per bed and per room are the same number.
function bgsfForRooms(typeId, rooms){ return bgsfPerBed()*(Number(S.typeFactors[typeId])||1)*rooms; }
// Convenience for all-private program (observation, any new unit) where rooms === beds.
function bgsfForBeds(typeId, beds){ return bgsfForRooms(typeId, beds); }

// ── Demand model ────────────────────────────────────────────────────
function demandMetrics(){
  var d=S.demand, m={};
  var disch=Number(d.ip_discharges.v), alos=Number(d.ip_alos.v);
  m.baseDays  = disch*alos;
  m.baseADC   = m.baseDays/365;
  m.avoided   = disch*Number(d.avoid_pct.v);
  m.ipDisch   = disch-m.avoided;
  m.ipDays    = m.ipDisch*alos;
  m.ipADC     = m.ipDays/365;
  m.ipBeds    = Math.ceil(m.ipADC*Number(d.ip_peak.v)/Number(d.ip_occ.v));
  m.edObs     = Number(d.ed_visits.v)*Number(d.ed_obs_rate.v);
  m.obsCases  = m.edObs+m.avoided;                 // avoided admissions land in observation
  m.obsDays   = m.obsCases*(Number(d.obs_hours.v)/24);
  m.obsADC    = m.obsDays/365;
  m.obsBeds   = Math.ceil(m.obsADC*Number(d.obs_peak.v)/Number(d.obs_occ.v));
  var t = existingTotals();
  m.supply    = t.proposed;                         // licensed beds after private conversion
  m.licensed  = Number(S.constraints.licensed_beds.v);
  m.headroom  = m.supply-m.ipBeds;                  // licensed beds spare after demand
  m.bedsLost  = t.beds-t.proposed;
  m.overCap   = m.supply>m.licensed;
  return m;
}

// ── Cost model ──────────────────────────────────────────────────────
function costMetrics(){
  var c=S.cost, m={};
  m.renoGSF = 0; m.newGSF = 0;
  if(typeof RC!=="undefined" && RC.scenarios){
    var sc = rcScenario();
    sc.phases.forEach(function(p){
      if(!p.enabled) return;
      m.renoGSF += Number(p.renoGSF)||0;
      m.newGSF  += Number(p.newGSF)||0;
    });
  }
  m.construction = (m.renoGSF*Number(c.reno_psf.v) + m.newGSF*Number(c.new_psf.v))/1e6;
  m.infra   = m.construction*Number(c.infra_pct.v);
  m.conting = (m.construction+m.infra)*Number(c.contingency_pct.v);
  m.soft    = (m.construction+m.infra+m.conting)*Number(c.soft_pct.v);
  var mid   = (typeof RC!=="undefined" && RC.scenarios) ? rcMidpointYears() : 3;
  m.escalYears = mid;
  var base  = m.construction+m.infra+m.conting+m.soft;
  m.escal   = base*(Math.pow(1+Number(c.escalation.v), mid)-1);
  m.total   = base+m.escal;
  m.cap     = Number(S.constraints.budget_cap.v);
  m.margin  = m.cap-m.total;
  return m;
}

  $("#ftr-l").textContent = S.project.name+" · "+S.project.version+" · Generated "+S.project.generated;

function kcard(label,val,cls,sub){
  return el("div",{class:"card"+(cls?" "+cls:"")},[
    el("div",{class:"lab"},[label]),
    el("div",{class:"big"},[val]),
    // a "\n" in the sub-line breaks it onto its own row

  ]);

function numField(obj,opts){
  opts=opts||{};
  var f = el("div",{class:"field"});
  var lab = el("label",null,[obj.label+(obj.unit?" ("+obj.unit+")":"")]);
  if(obj.assumed) lab.appendChild(el("span",{class:"assumed",title:"Planning assumption — confirm with BILH"},["assumed"]));
  f.appendChild(lab);
  var ln = el("div",{class:"ln"});
  // ×100 on a stored fraction throws off binary floating point (0.28 → 28.000000000000004),
  // so round the displayed value back to something a human typed.
  var shown = obj.pct? Math.round(obj.v*1e6)/1e4 : obj.v;
  var inp = el("input",{class:"input-line",type:"number",value:shown,step:opts.step||"any"});
  inp.addEventListener("change",function(e){
    var n = Number(e.target.value);
    if(!isNaN(n)&&n>=(opts.min===undefined?0:opts.min)){ obj.v = obj.pct?n/100:n; render(); }
    else e.target.value=shown;
  });
  ln.appendChild(inp);
  if(obj.pct) ln.appendChild(el("span",null,["%"]));
  f.appendChild(ln);
  // notes are kept as tooltips rather than grey paragraphs under every field
  if(obj.note){ if(opts.noNote) f.title=obj.note; else f.appendChild(el("div",{class:"hint"},[obj.note])); }
  return f;
}

// ====================================================================
// SITE GRAPHIC — vector site plan / axon from assets/site, drawn as one
// SVG (the drawing goes in as an <image>, the interactive layer on top)
// so the whole thing letter-boxes and centres itself in whatever box it
// is given, and zooming is just a viewBox change.
// buildSiteGraphic(which, opts):
//   which  : "axon" | "plan"
//   opts.tint(id)    -> {fill, op} or null  (phase tinting on the recap tab)
//   opts.sub(id)     -> small grey second label line (null = name only)
//   opts.label(id)   -> false to suppress a building's label entirely
//   opts.fillHeight  -> stretch to the container's height instead of
//                       taking its aspect ratio from the viewBox
//   opts.zoom        -> wheel to zoom about the cursor, drag to pan
//   opts.onclick(id) , opts.onhover(id|null)
// returns {el, highlight(id|null)} — highlight() drives table→map hover.
// ====================================================================
var SITE_LAYOUTS = [];      // label-layout callbacks, flushed at the end of render()
var SITE_GRAPHIC_UID = 0;   // keeps SVG filter/mask ids unique when several maps render
function buildSiteGraphic(which, opts){
  opts = opts||{};
  var G = SITE_GRAPHICS[which];
  var vb0 = G.vb.slice(), ns="http://www.w3.org/2000/svg";
  var RED = "#C00000";

  var holder = el("div",{style:"position:relative;width:100%;overflow:hidden;background:#fff"+
    (opts.fillHeight?";height:100%":"")});
  if(!opts.fillHeight) holder.style.aspectRatio = vb0[2]+" / "+vb0[3];

  var svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox",vb0.join(" "));
  svg.setAttribute("preserveAspectRatio","xMidYMid meet");
  svg.setAttribute("style","position:absolute;left:0;top:0;width:100%;height:100%;display:block");
  holder.appendChild(svg);

  // The axon highlight outline is the original extracted outline SVG, not a
  // second approximation of the hit polygons. A luminance mask limits that
  // one exact linework layer to whichever building is currently highlighted.
  var uid = "siteGraphic"+(++SITE_GRAPHIC_UID), defs=null, outlineMask=null, outlineFilter=null;
  var outlineMaskEls={}, outlineImg=null;
  if(G.outline){
    defs=document.createElementNS(ns,"defs");

    outlineFilter=document.createElementNS(ns,"filter");
    outlineFilter.setAttribute("id",uid+"OutlineRed");
    outlineFilter.setAttribute("x","0"); outlineFilter.setAttribute("y","0");
    outlineFilter.setAttribute("width","100%"); outlineFilter.setAttribute("height","100%");
    outlineFilter.setAttribute("color-interpolation-filters","sRGB");
    var flood=document.createElementNS(ns,"feFlood");
    flood.setAttribute("flood-color",RED); flood.setAttribute("result","outlineColor");
    var composite=document.createElementNS(ns,"feComposite");
    composite.setAttribute("in","outlineColor"); composite.setAttribute("in2","SourceAlpha");
    composite.setAttribute("operator","in");
    outlineFilter.appendChild(flood); outlineFilter.appendChild(composite);
    defs.appendChild(outlineFilter);

    outlineMask=document.createElementNS(ns,"mask");
    outlineMask.setAttribute("id",uid+"OutlineMask");
    outlineMask.setAttribute("maskUnits","userSpaceOnUse");
    outlineMask.setAttribute("maskContentUnits","userSpaceOnUse");
    outlineMask.setAttribute("x",0); outlineMask.setAttribute("y",0);
    outlineMask.setAttribute("width",G.w); outlineMask.setAttribute("height",G.h);
    outlineMask.setAttribute("style","mask-type:luminance");
    defs.appendChild(outlineMask);
    svg.appendChild(defs);
  }

  // the drawing itself, as the bottom layer of the same SVG
  var img=document.createElementNS(ns,"image");
  img.setAttribute("x",0); img.setAttribute("y",0);
  img.setAttribute("width",G.w); img.setAttribute("height",G.h);
  img.setAttributeNS("http://www.w3.org/1999/xlink","href",G.file);
  img.setAttribute("href",G.file);
  img.setAttribute("style","pointer-events:none");
  svg.appendChild(img);

  var polyEls={};
  function setHi(id,on){
    (polyEls[id]||[]).forEach(function(p){
      var t=p._tint;
      if(on){
        p.setAttribute("fill-opacity", t? Math.min(0.95,(t.op===undefined?0.42:t.op)+0.2) : 0.16);
        p.setAttribute("stroke-opacity",G.outline?0:1);
        p.setAttribute("stroke-width",G.outline?0:2.4);
      } else {
        p.setAttribute("fill-opacity", t?(t.op===undefined?0.42:t.op):0);
        p.setAttribute("stroke-opacity", t?0.9:0);
        p.setAttribute("stroke-width", t?1.6:0);
      }
    });
    (outlineMaskEls[id]||[]).forEach(function(p){
      p.setAttribute("fill-opacity",on?1:0);
      p.setAttribute("stroke-opacity",on?1:0);
    });
    var lg=labelEls[id];
    if(lg) lg.setAttribute("opacity", on? "1":"0.92");
  }

  S.buildings.forEach(function(b){
    var sh=G.buildings[b.id]; if(!sh) return;
    var t = opts.tint? opts.tint(b.id) : null;
    polyEls[b.id]=[];
    outlineMaskEls[b.id]=[];
    sh.polys.forEach(function(pts){
      var poly=document.createElementNS(ns,"polygon");
      poly.setAttribute("points",pts.map(function(p){return p[0]+","+p[1];}).join(" "));
      poly.setAttribute("fill", t?t.fill:RED);
      poly.setAttribute("fill-opacity", t?(t.op===undefined?0.42:t.op):0);
      poly.setAttribute("stroke", t?darkenColor((t.fill||"#888").slice(0,7),0.35):RED);
      poly.setAttribute("stroke-width", t?1.6:0);
      poly.setAttribute("stroke-opacity", t?0.9:0);
      poly.setAttribute("style","cursor:"+(opts.onclick?"pointer":"default")+";transition:fill-opacity .12s,stroke-opacity .12s");
      poly._tint=t;
      poly.addEventListener("mouseenter",function(){ setHi(b.id,true);  if(opts.onhover) opts.onhover(b.id); });
      poly.addEventListener("mouseleave",function(){ setHi(b.id,false); if(opts.onhover) opts.onhover(null); });
      if(opts.onclick) poly.addEventListener("click",function(){ opts.onclick(b.id); });
      var ttl=document.createElementNS(ns,"title");
      ttl.textContent=b.name+(opts.tooltip?" — "+opts.tooltip(b.id):"");
      poly.appendChild(ttl);
      polyEls[b.id].push(poly);
      svg.appendChild(poly);

      if(outlineMask){
        // The broad mask stroke includes both halves of the source outline,
        // even where the hand-authored hit polygon lands on its centreline.
        var mp=document.createElementNS(ns,"polygon");
        mp.setAttribute("points",pts.map(function(p){return p[0]+","+p[1];}).join(" "));
        mp.setAttribute("fill","#fff"); mp.setAttribute("stroke","#fff");
        mp.setAttribute("stroke-width",18); mp.setAttribute("stroke-linejoin","round");
        mp.setAttribute("fill-opacity",0); mp.setAttribute("stroke-opacity",0);
        outlineMask.appendChild(mp);
        outlineMaskEls[b.id].push(mp);
      }
    });
  });

  if(G.outline){
    outlineImg=document.createElementNS(ns,"image");
    outlineImg.setAttribute("x",0); outlineImg.setAttribute("y",0);
    outlineImg.setAttribute("width",G.w); outlineImg.setAttribute("height",G.h);
    outlineImg.setAttributeNS("http://www.w3.org/1999/xlink","href",G.outline);
    outlineImg.setAttribute("href",G.outline);
    outlineImg.setAttribute("mask","url(#"+uid+"OutlineMask)");
    outlineImg.setAttribute("filter","url(#"+uid+"OutlineRed)");
    outlineImg.setAttribute("style","pointer-events:none");
    svg.appendChild(outlineImg);
  }

  // RFP-style labels, after Figure 1: a red diamond on the building, a short
  // VERTICAL leader, and the name stacked above or below it, wrapped onto two
  // balanced lines when it is long. Everything is sized in screen pixels and
  // converted to drawing units at layout time, so the labels keep the same
  // size and leader length however far the map is zoomed.
  function wrapName(s){
    var w=String(s).split(/\s+/);
    if(w.length<2 || s.length<=11) return [s];
    var best=null;
    for(var i=1;i<w.length;i++){
      var a=w.slice(0,i).join(" "), b=w.slice(i).join(" ");
      var score=Math.abs(a.length-b.length);
      if(best===null||score<best.score) best={score:score, lines:[a,b]};
    }
    return best.lines;
  }
  // Which way the leader runs and how far, matching the RFP figure — the
  // staggered lengths are what keep the crowded centre of the campus legible.
  var LABEL_DIR={nw:-1, faceng:-1, occ:-1, mob:-1, west:1, east:1, perry:1, cfom:1, salt:1};
  var LABEL_LEAD={faceng:2.9, nw:1.5, occ:1.0, mob:1.05, west:1.0, east:1.7, perry:1.0, cfom:1.25, salt:1.0};

  var labelEls={}, labelParts=[];
  S.buildings.forEach(function(b){
    var sh=G.buildings[b.id]; if(!sh) return;
    if(opts.label && opts.label(b.id)===false) return;
    var pin=sh.pin, dir=LABEL_DIR[b.id]||-1;
    var g=document.createElementNS(ns,"g");
    g.setAttribute("style","cursor:"+(opts.onclick?"pointer":"default"));
    var dia=document.createElementNS(ns,"polygon"); dia.setAttribute("fill",RED); g.appendChild(dia);
    var ln=document.createElementNS(ns,"line"); ln.setAttribute("stroke",RED); g.appendChild(ln);
    var lines=wrapName(b.name).map(function(t){
      var e=document.createElementNS(ns,"text");
      e.setAttribute("text-anchor","middle");
      e.setAttribute("font-family","Roboto, Arial, sans-serif");
      e.setAttribute("font-weight","700"); e.setAttribute("fill",RED);
      e.textContent=t; g.appendChild(e); return e;
    });
    var subTxt = opts.sub? opts.sub(b.id) : null, subEl=null;
    if(subTxt){
      subEl=document.createElementNS(ns,"text");
      subEl.setAttribute("text-anchor","middle");
      subEl.setAttribute("font-family","Roboto, Arial, sans-serif");
      subEl.setAttribute("font-weight","500"); subEl.setAttribute("fill","#54637d");
      subEl.textContent=subTxt; g.appendChild(subEl);
    }
    g.addEventListener("mouseenter",function(){ setHi(b.id,true);  if(opts.onhover) opts.onhover(b.id); });
    g.addEventListener("mouseleave",function(){ setHi(b.id,false); if(opts.onhover) opts.onhover(null); });
    if(opts.onclick) g.addEventListener("click",function(){ opts.onclick(b.id); });
    labelEls[b.id]=g;
    labelParts.push({pin:pin, dir:dir, lead:(LABEL_LEAD[b.id]||1), dia:dia, ln:ln, lines:lines, sub:subEl});
    svg.appendChild(g);
  });

  // px → drawing units for the current viewBox, so labels hold their size
  var NAME_PX=13.5, SUB_PX=10.5, LEAD_PX=34, GAP_PX=5, LINE_PX=14.5, DIA_PX=4;
  function layoutLabels(){
    var box=svg.getAttribute("viewBox").split(" ").map(Number);
    var r=svg.getBoundingClientRect();
    if(!r.width) return;
    var u = box[2]/r.width;                       // drawing units per screen px
    var k = (opts.labelScale||1);                 // small panels want bigger type
    var name=NAME_PX*k*u, sub=SUB_PX*k*u, lead=LEAD_PX*k*u,
        gap=GAP_PX*k*u, lh=LINE_PX*k*u, dr=DIA_PX*k*u, sw=1.3*k*u;
    labelParts.forEach(function(p){
      var x=p.pin[0], y=p.pin[1], end=y+p.dir*lead*p.lead;
      p.dia.setAttribute("points",[[x,y-dr],[x+dr,y],[x,y+dr],[x-dr,y]].map(function(q){return q.join(",");}).join(" "));
      p.ln.setAttribute("x1",x); p.ln.setAttribute("y1",y);
      p.ln.setAttribute("x2",x); p.ln.setAttribute("y2",end);
      p.ln.setAttribute("stroke-width",sw);
      // stack the lines away from the building
      var n=p.lines.length;
      p.lines.forEach(function(e,i){
        var yy = p.dir<0 ? end-gap-(n-1-i)*lh : end+gap+name+i*lh;
        e.setAttribute("x",x); e.setAttribute("y",yy);
        e.setAttribute("font-size",name);
        e.setAttribute("style","paint-order:stroke;stroke:#ffffff;stroke-width:"+(3.2*k*u)+"px;stroke-linejoin:round");
      });
      if(p.sub){
        var base = p.dir<0 ? end-gap-(n-1)*lh-lh*0.92 : end+gap+name+(n-1)*lh+lh*0.92;
        p.sub.setAttribute("x",x); p.sub.setAttribute("y",base);
        p.sub.setAttribute("font-size",sub);
        p.sub.setAttribute("style","paint-order:stroke;stroke:#ffffff;stroke-width:"+(2.8*k*u)+"px;stroke-linejoin:round");
      }
    });
  }

  // Labels can only be sized once the SVG has a real width, which it does not
  // have while this element is still detached — render() flushes SITE_LAYOUTS
  // after appending the view, and the observer catches later resizes.
  SITE_LAYOUTS.push(layoutLabels);
  if(window.ResizeObserver){ new ResizeObserver(layoutLabels).observe(holder); }

  // ── wheel zoom about the cursor + drag to pan ────────────────────
  if(opts.zoom){
    var vb=vb0.slice(), MINW=vb0[2]*0.12, MAXW=vb0[2];
    function apply(){ svg.setAttribute("viewBox",vb.join(" ")); layoutLabels(); }
    function cursorPt(e){
      // where the cursor sits in drawing units, honouring the letter-boxing
      var r=svg.getBoundingClientRect();
      var s=Math.min(r.width/vb[2], r.height/vb[3]);
      var ox=(r.width-vb[2]*s)/2, oy=(r.height-vb[3]*s)/2;
      return [vb[0]+(e.clientX-r.left-ox)/s, vb[1]+(e.clientY-r.top-oy)/s];
    }
    holder.addEventListener("wheel",function(e){
      e.preventDefault();
      var p=cursorPt(e);
      var f=Math.pow(1.0016, e.deltaY);       // wheel down = zoom out
      var nw=Math.max(MINW, Math.min(MAXW, vb[2]*f));
      f=nw/vb[2];
      var nh=vb[3]*f;
      vb=[p[0]-(p[0]-vb[0])*f, p[1]-(p[1]-vb[1])*f, nw, nh];
      apply();
    },{passive:false});
    var pan=null;
    holder.addEventListener("mousedown",function(e){
      if(e.button!==0) return;
      pan={x:e.clientX,y:e.clientY,vb:vb.slice()};
      holder.style.cursor="grabbing";
    });
    document.addEventListener("mousemove",function(e){
      if(!pan) return;
      var r=svg.getBoundingClientRect();
      var s=Math.min(r.width/pan.vb[2], r.height/pan.vb[3]);
      vb=[pan.vb[0]-(e.clientX-pan.x)/s, pan.vb[1]-(e.clientY-pan.y)/s, pan.vb[2], pan.vb[3]];
      apply();
    });
    document.addEventListener("mouseup",function(){
      if(!pan) return;
      pan=null; holder.style.cursor="";
    });
    holder.title="Scroll to zoom · drag to pan · double-click to reset";
    holder.addEventListener("dblclick",function(){ vb=vb0.slice(); apply(); });
  }

  var current=null;
  return {el:holder, highlight:function(id){
    if(current&&current!==id) setHi(current,false);
    current=id;
    if(id) setHi(id,true);
  }};
}

  var cb = el("div",{class:"box"});
  cb.appendChild(el("h3",null,["Planning constraints"]));
  var cg = el("div",{style:"display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:10px"});
  ["licensed_beds","budget_cap","study_months","min_operating_beds"].forEach(function(k){ cg.appendChild(numField(S.constraints[k],{noNote:true})); });
  cb.appendChild(cg);
  two.appendChild(cb);

  var kb = el("div",{class:"box"});
  kb.appendChild(el("h3",{style:"margin-bottom:10px"},["Order-of-magnitude cost model"]));
  var kg = el("div",{style:"display:grid;grid-template-columns:1fr 1fr;gap:16px"});
  ["reno_psf","new_psf","infra_pct","soft_pct","contingency_pct","escalation"].forEach(function(k){ kg.appendChild(numField(S.cost[k],{step:"0.01",noNote:true})); });
  kb.appendChild(kg);
  two.appendChild(kb);
  v.appendChild(two);

  // Cost roll-up
  var cc = el("div",{class:"cards",style:"margin-bottom:22px"});
  cc.appendChild(kcard("Renovation area", fmt(c.renoGSF)+" GSF", null, "sum of enabled phases"));
  cc.appendChild(kcard("New construction", fmt(c.newGSF)+" GSF", null, c.newGSF?"addition required":"none — repurposing only"));
  cc.appendChild(kcard("Construction", money(c.construction)));
  cc.appendChild(kcard("MEP / infrastructure", money(c.infra)));
  cc.appendChild(kcard("Contingency", money(c.conting)));
  cc.appendChild(kcard("Soft costs", money(c.soft)));
  cc.appendChild(kcard("Escalation", money(c.escal), null, f1(c.escalYears)+" yr to midpoint"));
  cc.appendChild(kcard("Total project", money(c.total), c.margin>=0?"hi":"bad",
    (c.margin>=0?money(c.margin)+" under":money(-c.margin)+" over")+" the $"+fmt(c.cap)+"M cap"));
  v.appendChild(cc);

  // RFP schedule
  var ms = el("div");
  ms.appendChild(el("h2",null,["Procurement schedule"]));
  var mg = el("div",{class:"milestones"});
  [["18 Jun 2026","RFP issued"],["14 Jul 2026","Proposals due"],["28–31 Jul 2026","Interviews"],
   ["05 Aug 2026","Prime Consultant selected"],["10 Aug 2026","Contract / NTP"],["~10 Jan 2027","Study complete (5 months)"]
  ].forEach(function(p){
    mg.appendChild(el("div",null,[el("div",{class:"d"},[p[0]]),el("div",{class:"l"},[p[1]])]));
  });
  ms.appendChild(mg);
  ms.appendChild(el("p",{class:"hint"},[
    "Five deliverables: stacking-diagram concept plan · relocation / decanting & phasing sequences · infrastructure assessment report · CM cost estimate · overall implementation schedule."
  ]));
  v.appendChild(ms);

  return v;
}

      i.addEventListener("change",function(e){ u[f[0]]=Math.max(0,Number(e.target.value)||0); render(); });
      td.appendChild(i); r.appendChild(td);
    });
    r.appendChild(el("td",{class:"r nsf"},[fmt(unitExistingBeds(u))]));
    r.appendChild(el("td",{class:"r",title:semiRooms(u)+" of these are semi-private"},[fmt(unitRooms(u))]));
    var tdC=el("td",{class:"r"});
    if(semiRooms(u)>0){
      var cw=el("div",{style:"display:flex;align-items:baseline;justify-content:flex-end;gap:3px"});
      var ci=el("input",{class:"cell r",style:"width:32px",value:unitConverted(u)});

    tdA.appendChild(aw);
    r.appendChild(tdA);
    var bdelta=unitProposedBeds(u)-unitExistingBeds(u);
    r.appendChild(el("td",{class:"r nsf",style:bdelta===0?"":"color:"+(bdelta>0?"#1c6d5a":"#c07f00"),
      title:bdelta===0?"same as today":(bdelta>0?"+"+bdelta+" vs today":bdelta+" vs today")},[fmt(unitProposedBeds(u))]));
    r.appendChild(el("td",{class:"r"},[Math.round(unitPrivateBeds(u)/Math.max(1,unitProposedBeds(u))*100)+"%"]));
    r.appendChild(el("td",{class:"r",style:unitAdded(u)?"color:#c07f00;font-weight:900":"color:var(--faint)",
      title:unitAdded(u)?unitAdded(u)+" new rooms × "+fmt(bgsfPerBed()*(Number(S.typeFactors[u.type])||1))+" BGSF":""},
      [unitAdded(u)?"+"+fmt(unitAddedGSF(u)):"—"]));
    r.appendChild(el("td",{class:"r",title:fmt(unitRoomsAfter(u))+" rooms × "+fmt(bgsfPerBed()*(Number(S.typeFactors[u.type])||1))+" BGSF"},

  });
  var tr1 = el("tr",{class:"totalrow"});

  tr1.appendChild(el("td",null,[""])); tr1.appendChild(el("td",null,[""]));
  tr1.appendChild(el("td",{class:"r"},[fmt(t.single)]));
  tr1.appendChild(el("td",{class:"r"},[fmt(t.dbl)]));
  tr1.appendChild(el("td",{class:"r"},[fmt(t.beds)]));
  tr1.appendChild(el("td",{class:"r"},[fmt(t.rooms)]));
  tr1.appendChild(el("td",{class:"r"},[fmt(t.converted)+" of "+fmt(t.semiRooms)]));
  tr1.appendChild(el("td",{class:"r"},[fmt(t.added)]));
  tr1.appendChild(el("td",{class:"r"},[fmt(t.proposed)]));

  b2.appendChild(el("span",{class:"bt"},["Bed Demand & Observation Unit"]));
  b2.appendChild(el("span",{class:"chain",html:
    "<b>"+fmt(d.ipBeds)+"</b> licensed IP beds <span>+</span> <b>"+fmt(d.obsBeds)+"</b> observation beds"}));
  w2.appendChild(b2);
  w2.appendChild(el("div",{class:"cat-note"},[
    "The RFP's four drivers, made arithmetic: a dedicated observation unit for short-stay patients, fewer avoidable inpatient admissions, and capacity matched to level of care. Avoided admissions are re-cast as observation cases rather than disappearing. Volumes are placeholders until BILH provides actuals."
  ]));

  k2.appendChild(kcard("Avoidable admissions", fmt(d.avoided), null, "redirected to observation"));
  k2.appendChild(kcard("Inpatient ADC", f1(d.ipADC)));
  k2.appendChild(kcard("Licensed beds needed", fmt(d.ipBeds), "hi", "at "+Math.round(S.demand.ip_occ.v*100)+"% occupancy"));
  k2.appendChild(kcard("Observation cases / yr", fmt(d.obsCases)));
  k2.appendChild(kcard("Observation ADC", f1(d.obsADC)));

  k2.appendChild(kcard("Licensed supply", fmt(d.supply), null, "after private conversion"));
  k2.appendChild(kcard("Headroom", (d.headroom>=0?"+":"")+fmt(d.headroom)+" beds", d.headroom>=0?"hi":"bad",
    d.headroom>=0?"supply above demand":"short of demand"));
  w2.appendChild(k2);
  // the ledger below shows how each of those numbers is arrived at
  w2.appendChild(calcLedger(d));

  // Reconciliation narrative
  var rec = el("div",{style:"padding:14px 16px;background:#fbfcfd;border-top:1px solid var(--line);font-size:13.5px"});
  var obsGSF = bgsfForBeds("obs", d.obsBeds);
  rec.innerHTML =
    "<b>Reconciliation.</b> Converting <b>"+fmt(t.converted)+"</b> of the "+fmt(t.semiRooms)+" semi-private rooms takes the hospital from <b>"+
    fmt(t.beds)+"</b> beds at "+Math.round(t.existingPrivatePct*100)+"% private to <b>"+fmt(t.proposed)+"</b> beds at <b>"+
    Math.round(t.privatePct*100)+"%</b> private, comfortably inside the "+fmt(S.constraints.licensed_beds.v)+"-bed licence. "+
    "Demand after removing avoidable admissions is <b>"+fmt(d.ipBeds)+"</b> licensed beds, so the conversion leaves <b>"+
    (d.headroom>=0?"+":"")+fmt(d.headroom)+"</b> beds of headroom"+
    (d.headroom>=0? " — the licence is not the binding constraint." : " — demand exceeds supply, so the conversion is too aggressive.")+

    fmt(t.beds-t.proposed)+" beds given up release no square feet. The "+fmt(d.obsBeds)+"-bed observation unit therefore needs a further <b>≈"+

  ]));
  var k3 = el("div",{class:"kpis"});
  k3.appendChild(kcardEdit("Module beds", S.module.beds, 1));
  k3.appendChild(kcard("NSF / bed", fmt(nsfPerBed())));
  k3.appendChild(kcard("DGSF / bed", fmt(dgsfPerBed())));
  k3.appendChild(kcard("BGSF / bed", fmt(bgsfPerBed()), "hi"));
  w3.appendChild(k3);

  var tb3 = el("table",{class:"prog"});
  tb3.appendChild(el("thead",null,[el("tr",null,[
    el("th",null,["Program category"]),
    el("th",{class:"r",style:"width:90px"},["NSF"]),
    el("th",{class:"r",style:"width:70px"},["% of unit"]),
    el("th",{class:"r",style:"width:84px"},["NSF / bed"]),
    el("th",null,["Content"])
  ])]));
  var tb3b = el("tbody");
  S.module.rows.forEach(function(r){
    var tr = el("tr");
    tr.appendChild(el("td",{style:"font-weight:500"},[r.cat]));
    var td=el("td",{class:"r"});
    var i=el("input",{class:"cell r",value:r.nsf});
    i.addEventListener("change",function(e){ r.nsf=Math.max(0,Number(e.target.value)||0); render(); });
    td.appendChild(i); tr.appendChild(td);
    tr.appendChild(el("td",{class:"r"},[Math.round((Number(r.nsf)||0)/moduleNSF()*100)+"%"]));
    tr.appendChild(el("td",{class:"r"},[fmt((Number(r.nsf)||0)/Number(S.module.beds.v))]));
    tr.appendChild(el("td",{style:"font-size:11.5px;font-weight:300;color:var(--mut)"},[r.note]));
    tb3b.appendChild(tr);
  });
  var tr3 = el("tr",{class:"totalrow"});
  tr3.appendChild(el("td",null,["Total net square feet"]));
  tr3.appendChild(el("td",{class:"r"},[fmt(moduleNSF())]));
  tr3.appendChild(el("td",{class:"r"},["100%"]));

  tr3.appendChild(el("td",null,[""]));
  tb3b.appendChild(tr3);

  trx.appendChild(el("td",{style:"font-weight:300;color:var(--mut)"},[S.module.excluded.cat+" (excluded)"]));

  trx.appendChild(el("td",null,[""])); trx.appendChild(el("td",null,[""]));
  trx.appendChild(el("td",{style:"font-size:11.5px;font-weight:300;color:var(--mut)"},[S.module.excluded.note]));
  tb3b.appendChild(trx);
  tb3.appendChild(tb3b);
  w3.appendChild(tb3);

  // Unit type factors + resulting per-type areas
  var tf = el("table",{class:"prog"});
  tf.appendChild(el("thead",null,[el("tr",null,[
    el("th",{style:"width:44px"},[""]),
    el("th",null,["Unit type"]),
    el("th",{class:"c",style:"width:90px"},["Licensed"]),
    el("th",{class:"r",style:"width:88px"},["Area factor"]),
    el("th",{class:"r",style:"width:92px"},["NSF / room"]),
    el("th",{class:"r",style:"width:98px"},["BGSF / room"]),
    el("th",{class:"r",style:"width:78px"},["Rooms"]),
    el("th",{class:"r",style:"width:96px"},["Beds proposed"]),
    el("th",{class:"r",style:"width:96px"},["BGSF"])
  ])]));
  var tfb = el("tbody");
  var totBeds=0, totGSF=0, totRooms=0;
  UNIT_TYPES.forEach(function(ut){
    var ofType = S.existing.filter(function(u){return u.type===ut.id;});
    var beds  = ofType.reduce(function(a,u){return a+unitProposedBeds(u);},0);
    var rooms = ofType.reduce(function(a,u){return a+unitRoomsAfter(u);},0);   // includes rooms added to hold beds
    if(ut.id==="obs"){ beds = d.obsBeds; rooms = d.obsBeds; }
    var f = Number(S.typeFactors[ut.id])||1;
    var gsf = bgsfPerBed()*f*rooms;
    totBeds+=beds; totGSF+=gsf; totRooms+=rooms;
    var tr=el("tr");
    tr.appendChild(el("td",{class:"c"},[el("span",{class:"sw",style:"background:"+utypeHex(ut.id)})]));
    tr.appendChild(el("td",{style:"font-weight:500"},[ut.name]));
    tr.appendChild(el("td",{class:"c",style:"font-size:11.5px;font-weight:300;color:var(--mut)"},[ut.licensed?"licensed":"unlicensed"]));
    var td=el("td",{class:"r"});
    var i=el("input",{class:"cell r",value:f});
    i.addEventListener("change",function(e){ S.typeFactors[ut.id]=Math.max(0.1,Number(e.target.value)||1); render(); });
    td.appendChild(i); tr.appendChild(td);
    tr.appendChild(el("td",{class:"r"},[fmt(nsfPerBed()*f)]));
    tr.appendChild(el("td",{class:"r"},[fmt(bgsfPerBed()*f)]));
    tr.appendChild(el("td",{class:"r"},[fmt(rooms)]));
    tr.appendChild(el("td",{class:"r nsf"},[fmt(beds)]));
    tr.appendChild(el("td",{class:"r"},[fmt(gsf)]));

  trf.appendChild(el("td",{class:"r"},[fmt(totRooms)]));
  trf.appendChild(el("td",{class:"r"},[fmt(totBeds)]));
  trf.appendChild(el("td",{class:"r"},[fmt(totGSF)]));
  tfb.appendChild(trf);
  tf.appendChild(tfb);
  v.appendChild(w3);

  v.appendChild(adminSection());

  // the per-unit-type roll-up summarises everything above it, so it closes the page
  var sumWrap = el("div",{class:"prog-cat"});
  var sumBand = el("div",{class:"band",style:"background:#233044"});
  sumBand.appendChild(el("span",{class:"bt",style:"color:#fff"},["Inpatient Program Summary \u2014 by unit type"]));
  sumBand.appendChild(el("span",{class:"chain",style:"color:#fff"},[""]));
  sumWrap.appendChild(sumBand);
  sumWrap.appendChild(tf);
  v.appendChild(sumWrap);
  return v;
}



// a KPI card whose headline number is editable
function kcardEdit(label, obj, min, sub){
  var c = el("div",{class:"card"});

  var inp = el("input",{type:"text", value:obj.v, title:obj.label,
    style:"width:100%;font-family:inherit;font-weight:900;font-size:21px;color:var(--ink);"+
          "background:transparent;border:none;border-bottom:1px solid #c7cfdb;padding:0 0 1px;"+
          "outline:none;font-feature-settings:'tnum' 1"});
  inp.addEventListener("focus",function(){ inp.style.borderBottomColor="var(--accent)"; });
  inp.addEventListener("blur",function(){ inp.style.borderBottomColor="#c7cfdb"; });
  inp.addEventListener("change",function(e){
    var n=Number(String(e.target.value).replace(/[^0-9.]/g,""));
    if(!isNaN(n)&&n>=(min===undefined?0:min)){ obj.v=n; render(); } else e.target.value=obj.v;
  });

  if(sub) c.appendChild(el("div",{class:"sm"},[sub]));

}
// ── demand calculation ledger ───────────────────────────────────────
// inlineNum renders a driver as an editable value inside a sentence
function inlineNum(key, w){
  var o = S.demand[key];
  var shown = o.pct? Math.round(o.v*1e6)/1e4 : o.v;
  var wrap = el("span",{style:"display:inline-flex;align-items:baseline;gap:2px;white-space:nowrap"});
  var inp = el("input",{type:"text", value:shown, title:o.label+(o.assumed?" (assumed \u2014 confirm with BILH)":""),
    style:"width:"+(w||46)+"px;font-family:inherit;font-size:13px;font-weight:900;color:var(--ink);"+
          "background:#fff;border:none;border-bottom:1px solid "+(o.assumed?"#e0c98a":"#c7cfdb")+";"+
          "text-align:center;padding:1px 0;outline:none;font-feature-settings:'tnum' 1"});
  inp.addEventListener("focus",function(){ inp.style.borderBottomColor="var(--accent)"; });
  inp.addEventListener("blur",function(){ inp.style.borderBottomColor=o.assumed?"#e0c98a":"#c7cfdb"; });
  inp.addEventListener("change",function(e){
    var n=Number(String(e.target.value).replace(/[^0-9.\-]/g,""));
    if(!isNaN(n)&&n>=0){ o.v = o.pct? n/100 : n; render(); } else e.target.value=shown;
  });
  wrap.appendChild(inp);
  if(o.pct) wrap.appendChild(el("span",{style:"font-size:11px;color:var(--mut)"},["%"]));
  return wrap;
}
function ledgerHead(txt){
  var tr=el("tr");
  tr.appendChild(el("td",{colspan:"4",style:"background:#f3f6f9;font-weight:900;font-size:10.5px;"+
    "text-transform:uppercase;letter-spacing:.09em;color:var(--mut);padding:7px 10px"},[txt]));

// one equation: label · the calculation (mixed text + inputs) · = · result
function ledgerRow(step, label, parts, result, unit, hi){

  parts.forEach(function(x){
    line.appendChild(typeof x==="string"
      ? el("span",{style:"color:var(--mut)"},[x]) : x);
  });
  calc.appendChild(line);
  tr.appendChild(calc);
  tr.appendChild(el("td",{class:"r",style:"width:150px;font-weight:900;font-feature-settings:'tnum' 1;"+
    (hi?"color:var(--hlt)":"")},[result+(unit?" "+unit:"")]));

}

  tb.appendChild(ledgerHead("Observation beds"));

    fmt(d.obsBeds),"beds",true));

  tb.appendChild(ledgerHead("Supply against demand"));
  var tt=existingTotals();
  tb.appendChild(ledgerRow("12","Licensed supply",
    ["from the table above \u2014 "+fmt(tt.rooms)+" rooms today, "+fmt(tt.converted)+" converted, "+fmt(tt.added)+" added"],
    fmt(d.supply),"beds"));

    fmt(bgsfForBeds("obs",d.obsBeds)),"BGSF"));

  t.appendChild(tb);

// ====================================================================
// ADMINISTRATIVE OFFICE — the Burlington program section, carried over
// intact: same drivers, KPI cards, editable room table with drag-reorder
// and the Payette colour picker.
// ====================================================================
function admNSF(){ return S.admin.rooms.reduce(function(a,r){ return a+(Number(r.qty)||0)*(Number(r.size)||0); },0); }
function admDrv(k){ var d=S.admin.drivers[k]; return d?Number(d.v):0; }
function admMetrics(){
  var m={nsf:admNSF()};
  // seats are counted off the room list, exactly as in Burlington
  m.seats = S.admin.rooms.reduce(function(a,r){
    if(/private/i.test(r.name)&&/office/i.test(r.name)) return a+(Number(r.qty)||0);
    if(/workstation/i.test(r.name)) return a+(Number(r.qty)||0);
    return a;
  },0);
  m.dgsf = m.nsf*admDrv("dgsf_factor");
  m.gsf  = m.dgsf*Number(S.admin.grossing.v);
  m.headcount = admDrv("headcount");
  m.seatsPerPerson = m.headcount? m.seats/m.headcount : 0;
  m.sfPerPerson = m.headcount? m.gsf/m.headcount : 0;
  return m;
}
function admColorPicker(current, onpick){
  var wrap = el("span",{class:"color-pick",style:"background:"+hcHex(current),title:hcEntry(current)?hcEntry(current).label:current});
  var sel = el("select");
  var groups = {};
  HC_CATALOG.forEach(function(c){ (groups[c.group]=groups[c.group]||[]).push(c); });
  for(var g in groups){
    var og = el("optgroup",{label:g});
    groups[g].forEach(function(c){
      var o = el("option",{value:c.code},[c.label]);
      if(c.code===current) o.selected=true;
      og.appendChild(o);
    });
    sel.appendChild(og);
  }
  sel.addEventListener("change",function(e){ onpick(e.target.value); });
  wrap.appendChild(sel);
  return wrap;
}
function admDriverField(key){
  var d = S.admin.drivers[key];
  var f = el("div",{class:"field"});
  f.appendChild(el("label",null,[d.label]));
  var ln = el("div",{class:"ln"});
  var shown = d.pct? Math.round(d.v*1e6)/1e4 : d.v;
  var inp = el("input",{class:"input-line",type:"number",value:shown,step:"any"});
  inp.addEventListener("change",function(e){
    var n = Number(e.target.value);
    if(!isNaN(n)&&n>=0){ d.v = d.pct?n/100:n; render(); } else e.target.value=shown;
  });
  ln.appendChild(inp);
  if(d.pct) ln.appendChild(el("span",null,["%"]));
  f.appendChild(ln);
  return f;
}
var ADM_DRAG=null;
function admRowDrag(trEl, ri){
  trEl.addEventListener("dragstart",function(e){ ADM_DRAG=ri; trEl.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; });
  trEl.addEventListener("dragend",function(){ ADM_DRAG=null; trEl.classList.remove("dragging"); render(); });
  trEl.addEventListener("dragover",function(e){
    if(ADM_DRAG===null) return;
    e.preventDefault();
    var rect=trEl.getBoundingClientRect(), before=(e.clientY-rect.top)<rect.height/2;
    trEl.classList.toggle("drag-over-top",before);
    trEl.classList.toggle("drag-over-bottom",!before);
  });
  trEl.addEventListener("dragleave",function(){ trEl.classList.remove("drag-over-top","drag-over-bottom"); });
  trEl.addEventListener("drop",function(e){
    if(ADM_DRAG===null) return;
    e.preventDefault();
    var rect=trEl.getBoundingClientRect(), before=(e.clientY-rect.top)<rect.height/2;
    var from=ADM_DRAG, to=ri+(before?0:1);
    if(from<to) to--;
    var moved=S.admin.rooms.splice(from,1)[0];
    S.admin.rooms.splice(to,0,moved);
    ADM_DRAG=null; render();
  });
}
function adminSection(){
  var cat = S.admin, m = admMetrics();
  var wrap = el("div",{class:"prog-cat"});
  var band = el("div",{class:"band",style:"background:"+cat.color});
  var nameInp = el("input",{class:"bt-input",type:"text",value:cat.name});

  band.appendChild(nameInp);
  band.appendChild(el("span",{class:"chain",html:
    "<b>"+fmt(m.nsf)+"</b> NSF <span>× "+admDrv("dgsf_factor").toFixed(2)+"</span> <b>"+fmt(m.dgsf)+
    "</b> DGSF <span>× "+Number(cat.grossing.v).toFixed(2)+"</span> <b>"+fmt(m.gsf)+"</b> GSF"}));
  band.appendChild(el("button",{class:"seg sm",style:"background:rgba(255,255,255,.75)",onclick:function(){
    cat.rooms.push({name:"New room",qty:1,size:100,kpu:false,color:"SU-bldg",notes:""});
    render();
  }},["+ Room"]));
  wrap.appendChild(band);
  wrap.appendChild(el("div",{class:"cat-note"},[cat.note]));

  var dw = el("div",{class:"drivers"});
  ["headcount","seat_ratio","pvt_pct","dgsf_factor"].forEach(function(k){ dw.appendChild(admDriverField(k)); });
  wrap.appendChild(dw);

  var kw = el("div",{class:"kpis"});
  kw.appendChild(kcard("Headcount", fmt(m.headcount)));
  kw.appendChild(kcard("Seats", fmt(m.seats)));
  kw.appendChild(kcard("Seats / person", f1(m.seatsPerPerson)));
  kw.appendChild(kcard("NSF", fmt(m.nsf)));
  kw.appendChild(kcard("DGSF", fmt(m.dgsf)));
  kw.appendChild(kcard("GSF", fmt(m.gsf), "hi"));
  kw.appendChild(kcard("GSF / person", fmt(m.sfPerPerson)));
  wrap.appendChild(kw);

  var t = el("table",{class:"prog"});
  t.appendChild(el("thead",null,[el("tr",null,[
    el("th",{style:"width:16px"},[""]),
    el("th",{style:"width:24px"},["#"]),
    el("th",null,["Space"]),
    el("th",{class:"r",style:"width:52px"},["Qty"]),
    el("th",{class:"r",style:"width:76px"},["Size ea"]),
    el("th",{class:"r",style:"width:76px"},["NSF"]),
    el("th",{class:"c",style:"width:42px"},["KPU"]),
    el("th",{class:"c",style:"width:44px"},["Color"]),
    el("th",null,["Notes"]),
    el("th",{style:"width:28px"},[""])
  ])]));
  var tb = el("tbody");
  cat.rooms.forEach(function(r, ri){
    var rowNSF=(Number(r.qty)||0)*(Number(r.size)||0);
    var tr = el("tr",{draggable:"true"});
    tr.appendChild(el("td",{class:"dragc"},["⋮⋮"]));
    tr.appendChild(el("td",{class:"rown"},[String(ri+1)]));
    var tdN=el("td"); var iN=el("input",{class:"cell",value:r.name});
    iN.addEventListener("change",function(e){ r.name=e.target.value; render(); });
    tdN.appendChild(iN); tr.appendChild(tdN);
    var tdQ=el("td",{class:"r"}); var iQ=el("input",{class:"cell r",value:r.qty});
    iQ.addEventListener("change",function(e){ r.qty=Number(e.target.value)||0; render(); });
    tdQ.appendChild(iQ); tr.appendChild(tdQ);
    var tdS=el("td",{class:"r"}); var iS=el("input",{class:"cell r",value:r.size});
    iS.addEventListener("change",function(e){ r.size=Number(e.target.value)||0; render(); });
    tdS.appendChild(iS); tr.appendChild(tdS);
    tr.appendChild(el("td",{class:"r nsf"},[fmt(rowNSF)]));
    var tdK=el("td",{class:"c"});
    var cb=el("input",{type:"checkbox",style:"width:14px;height:14px;cursor:pointer;accent-color:#233044"});
    cb.checked=!!r.kpu;
    cb.addEventListener("change",function(e){ r.kpu=e.target.checked; render(); });
    tdK.appendChild(cb); tr.appendChild(tdK);
    var tdC=el("td",{class:"c"});
    tdC.appendChild(admColorPicker(r.color,function(code){ r.color=code; render(); }));
    tr.appendChild(tdC);
    var tdNo=el("td"); var iNo=el("input",{class:"cell notes",value:r.notes||""});
    iNo.addEventListener("change",function(e){ r.notes=e.target.value; });
    tdNo.appendChild(iNo); tr.appendChild(tdNo);
    var tdD=el("td",{class:"c"});
    tdD.appendChild(el("button",{class:"delb",title:"Delete row",onclick:function(){
      if(confirm("Delete “"+r.name+"”?")){ cat.rooms.splice(ri,1); render(); }
    }},["✕"]));
    tr.appendChild(tdD);
    admRowDrag(tr,ri);
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  wrap.appendChild(t);
  return wrap;
}

// ====================================================================
// Export / Import
// ====================================================================
function exportJSON(){
  var out = JSON.parse(JSON.stringify(S));
  if(typeof RC!=="undefined") out.recap_scenarios = RC.scenarios;
  var blob = new Blob([JSON.stringify(out,null,1)],{type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "BILH_Exeter_Dashboard_state.json";
  a.click();
}
function importJSON(evt){
  var f = evt.target.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(e){
    try{
      var ns = JSON.parse(e.target.result);
      if(ns.recap_scenarios && typeof RC!=="undefined"){
        RC.scenarios = ns.recap_scenarios.map(rcNormalizeScenario);
        RC.active = 0;
        delete ns.recap_scenarios;
      }
      S = ns; render();
    }
    catch(err){ alert("Import failed: "+err); }
  };
  rd.readAsText(f);
}

// ====================================================================
// Render
// ====================================================================
function render(){
  renderHeader();
  renderTabs();
  var view = $("#view"); view.innerHTML="";
  SITE_LAYOUTS = [];
  if(state.tab==="assumptions") view.appendChild(tabAssumptions());
  else if(state.tab==="program") view.appendChild(tabProgram());
  else if(state.tab==="floors") view.appendChild(tabFloors());
  else view.appendChild(tabRecap());
  // now that the view is in the document the maps have a width, so their
  // labels can be sized in real screen pixels
  SITE_LAYOUTS.forEach(function(f){ try{ f(); }catch(e){} });
}
